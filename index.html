/* =========================================================
   МОИ ЗАКАЗЫ: номера и ключи заказов хранятся в браузере покупателя,
   сервер по ключу отдаёт состав, сумму и статус (без имени, телефона и адреса)
   ========================================================= */
const MY_KEY="tairi-orders";
function myList(){
  try{ const a=JSON.parse(localStorage.getItem(MY_KEY)||"[]"); return Array.isArray(a) ? a.filter(x=>x && /^T-[A-Z0-9]{4,12}$/.test(x.id) && /^[a-f0-9]{16}$/.test(x.k)) : []; }catch(e){ return []; }
}
function mySave(a){ try{ localStorage.setItem(MY_KEY, JSON.stringify(a.slice(0,20))); }catch(e){} }
function myAdd(id,k){ if(!id||!k) return; const a=myList().filter(x=>x.id!==id); a.unshift({id,k,t:Date.now()}); mySave(a); }
function myGet(id){ return myList().find(x=>x.id===id); }
function myLink(id){ const it=myGet(id); return it ? `${location.origin}${location.pathname}#my/${it.id}/${it.k}` : ""; }
/* Личная ссылка вида tahiry.world/#my/T-AB12CD/ключ: добавляет заказ в «Мои заказы» на этом устройстве */
function myImport(h){
  const m=/^my\/(T-[A-Z0-9]{4,12})\/([a-f0-9]{16})$/.exec(h||"");
  if(!m) return false;
  if(!myGet(m[1])) myAdd(m[1],m[2]);
  try{ history.replaceState(null,"","#my"); }catch(e){}
  return true;
}
const MY_ST={new:"Принят", unpaid:"Не оплачен", paid:"Оплачен", shipped:"Отправлен", cancelled:"Отменён"};
function myStatus(o){
  if(o.status==="new" && o.pay==="card" && o.can_pay) return "Ждёт оплаты";
  if(o.status==="shipped" && o.ship==="pickup") return "Получен";
  return MY_ST[o.status]||o.status;
}
function myNext(o){
  const tg=`<a href="${CONFIG.tg}" target="_blank" rel="noopener">Telegram</a>`;
  if(o.status==="new" && o.pay==="card" && o.can_pay) return VIA_CDN ? "Заказ ждёт оплаты картой. Страница Т-Банка не открывается с VPN и из-за границы: выключи VPN, обнови страницу и нажми «Оплатить»." : "Заказ ждёт оплаты картой." + (o.lines.some(l=>l.one) ? " Вещи 1/1 держатся за тобой 25 минут после нажатия «Оплатить»." : "");
  if(o.status==="new") return `Таири напишет тебе в ${tg} и пришлёт ${o.pay==="transfer"?"реквизиты":"ссылку"} для оплаты.`;
  if(o.status==="unpaid") return o.can_pay ? "Оплата не прошла. Можно попробовать ещё раз или оплатить переводом — напиши Таири." : `Оплата не прошла. Напиши Таири в ${tg}.`;
  if(o.status==="paid") return o.ship==="pickup" ? `Оплата получена. Таири напишет в ${tg}, чтобы договориться о самовывозе.` : "Оплата получена. Таири соберёт заказ и отправит СДЭК — здесь появится трек-номер.";
  if(o.status==="shipped") return o.ship==="pickup" ? "Заказ получен. Спасибо!" : "Заказ отправлен СДЭК.";
  if(o.status==="cancelled") return `Заказ отменён. Если это ошибка, напиши Таири в ${tg}.`;
  return "";
}
function myCard(o){
  if(o.missing) return `<article class="myo-card"><div class="myo-top"><span class="myo-id">Заказ ${o.id}</span></div><p class="myo-next">Заказ не найден. Возможно, ссылка неполная — напиши Таири в <a href="${CONFIG.tg}" target="_blank" rel="noopener">Telegram</a>.</p><button class="myo-rm" data-myrm="${o.id}">Убрать из списка</button></article>`;
  const wait=o.can_pay && (o.status==="new"||o.status==="unpaid") && o.pay==="card";
  const date=new Date(o.created); const ds=isNaN(date)?"":date.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})+", "+date.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const track=o.track?`<p class="myo-next">Трек-номер СДЭК: <a href="https://www.cdek.ru/ru/tracking?order_id=${encodeURIComponent(o.track)}" target="_blank" rel="noopener">${o.track}</a></p>`:"";
  return `<article class="myo-card${wait?" wait":""}">
    <div class="myo-top"><span class="myo-id">Заказ ${o.id}</span><span class="myo-st${o.status==="paid"||o.status==="shipped"?" on":""}">${myStatus(o)}</span></div>
    <div class="myo-date">${ds} · ${o.pay==="card"?"картой онлайн":"переводом"} · ${o.ship==="pickup"?"самовывоз":"СДЭК"}</div>
    <ul>${o.lines.map(l=>`<li>${nbsp(l.name)}${l.size?`, ${l.size}`:""} × ${l.qty} — ${rub(l.price*l.qty)}${l.one?" (1/1)":""}</li>`).join("")}</ul>
    <div class="totals">${o.disc?`<div><span>Скидка ${o.promo}</span><span>−${rub(o.disc)}</span></div>`:""}<div><span>Доставка</span><span>${o.ship_cost?rub(o.ship_cost):"0 ₽"}</span></div><div class="sum"><span>Итого</span><span>${rub(o.total)}</span></div></div>
    <p class="myo-next">${myNext(o)}</p>${track}
    <div class="myo-act">${wait?`<button class="btn" data-mypay="${o.id}">Оплатить ${rub(o.total)}</button>`:""}<button class="btn ghost" data-mylink="${o.id}">Скопировать ссылку на заказ</button><div class="msg" id="mym-${o.id}" role="status"></div></div>
    <button class="myo-rm" data-myrm="${o.id}">Убрать из списка</button>
  </article>`;
}
let MY_NOTE="";
function renderMy(note){
  note=note||MY_NOTE; MY_NOTE="";
  const list=myList();
  app.innerHTML=`<section class="view wrap">${head("Мои заказы","Заказы, оформленные на сайте с этого устройства. Статус обновляется сам: оплату видно сразу, отправку — когда Таири отметит её.")}
    <div class="myo" id="myList">${note?`<div class="myo-note">${note}</div>`:""}${list.length?`<p class="myo-empty" id="myLoading">Загружаем заказы…</p>`:`<p class="myo-empty">Здесь пока пусто. Заказ появится сразу после оформления. Если ты оформлял заказ на другом устройстве, открой ссылку на заказ или найди его по номеру ниже.</p>`}</div>
    <div class="myo-find"><h2>Найти заказ</h2><p>Номер заказа (например, T-AB12CD) есть в сообщении от Таири и на экране после оформления. Телефон — тот, что указан в заказе.</p>
      <form id="findForm" novalidate><div class="two"><div class="field"><label for="fId">Номер заказа</label><input id="fId" placeholder="T-AB12CD" autocomplete="off" autocapitalize="characters"></div><div class="field"><label for="fPhone">Телефон</label><input id="fPhone" type="tel" placeholder="+7" autocomplete="tel"></div></div>
      <button class="btn" type="submit">Найти</button><div class="msg" id="findMsg" role="status"></div></form></div>
  </section>${footer()}`;
  $("#findForm").onsubmit=findOrder;

let MY_REQ=0;
async function loadMy(note){
  const list=myList(), req=++MY_REQ;
  let d=null;
  try{
    const r=await fetch(CONFIG.api+"?a=my",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orders:list.map(x=>({id:x.id,k:x.k}))})});
    if(r.headers.get("x-shard")||r.headers.get("x-id")) VIA_CDN=true;
    d=r.ok ? await r.json() : null;
  }catch(e){}
  const box=$("#myList"); if(!box || req!==MY_REQ) return;
  if(!d || !Array.isArray(d.orders)){ box.innerHTML=`${note?`<div class="myo-note">${note}</div>`:""}<p class="myo-empty">Не получилось загрузить заказы. Проверь интернет и обнови страницу.</p>`; return; }
  box.innerHTML=(note?`<div class="myo-note">${note}</div>`:"")+d.orders.map(myCard).join("");
  // заказ из «ждёт оплаты» уже оплачен или отменён — напоминание об оплате больше не нужно
  try{ const p=JSON.parse(localStorage.getItem("tairi-pending")||"null"); const o=p&&d.orders.find(x=>x.id===p.num); if(o && !o.missing && !(o.status==="new"&&o.can_pay)) localStorage.removeItem("tairi-pending"); }catch(e){}
}
function myClick(e){
  const pay=e.target.closest("[data-mypay]"), link=e.target.closest("[data-mylink]"), rm=e.target.closest("[data-myrm]");
  if(pay) payOrder(pay.dataset.mypay, pay);
  if(link){ copyText(myLink(link.dataset.mylink)); link.textContent="Ссылка скопирована"; }
  if(rm && confirm(`Убрать заказ ${rm.dataset.myrm} из списка на этом устройстве? Сам заказ не отменится.`)){ mySave(myList().filter(x=>x.id!==rm.dataset.myrm)); renderMy(); }
}
async function payOrder(id, btn){
  const it=myGet(id), m=$("#mym-"+id); if(!it) return;
  btn.disabled=true; if(m){ m.className="msg"; m.textContent="Открываем оплату…"; }
  try{
    const r=await fetch(CONFIG.api+"?a=pay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,k:it.k})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.paymentUrl){
      try{ localStorage.setItem("tairi-pending", JSON.stringify({num:id, api:true, at:Date.now()})); }catch(e){}
      location.href=d.paymentUrl; return;
    }
    if(m){ m.className="msg err"; m.textContent=d.error||"Не получилось открыть оплату. Попробуй ещё раз."; }
    if(r.status===409) setTimeout(()=>loadMy(),2500);
  }catch(e){ if(m){ m.className="msg err"; m.textContent="Не получилось открыть оплату. Проверь интернет и попробуй ещё раз."; } }
  btn.disabled=false;
}
async function findOrder(e){
  e.preventDefault();
  const m=$("#findMsg"), id=$("#fId").value.trim(), phone=$("#fPhone").value.trim(), btn=e.target.querySelector("button");
  if(!id||!phone){ m.className="msg err"; m.textContent="Нужны номер заказа и телефон."; return; }
  btn.disabled=true; m.className="msg"; m.textContent="Ищем…";
  try{
    const r=await fetch(CONFIG.api+"?a=find",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,phone})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.order && d.key){ myAdd(d.order.id,d.key); renderMy(); return; }
    m.className="msg err"; m.textContent=d.error||"Заказ не найден.";
  }catch(err){ m.className="msg err"; m.textContent="Не получилось связаться с сайтом. Попробуй ещё раз."; }
  btn.disabled=false;
}
/* Напоминание внизу экрана: заказ ждёт оплаты (например, страница банка не открылась из-за VPN) */
function showPayBar(){
  let p=null; try{ p=JSON.parse(localStorage.getItem("tairi-pending")||"null"); }catch(e){}
  if(!p || !p.api || !p.at || Date.now()-p.at>30*60000 || !myGet(p.num)) return;
  if((location.hash||"").startsWith("#my")) return;
  const bar=document.createElement("div"); bar.className="paybar"; bar.id="paybar";
  bar.innerHTML=`<span>Заказ ${p.num} ждёт оплаты</span><button class="btn" data-go="my">Оплатить</button><button class="x" aria-label="Скрыть">×</button>`;
  bar.querySelector(".x").onclick=()=>{ try{ localStorage.removeItem("tairi-pending"); }catch(e){} bar.remove(); };
  document.body.appendChild(bar);
}
function hidePayBar(){ const b=$("#paybar"); if(b) b.remove(); }

function ledColumns(text){
  const cols=[];
  for(const ch of text.toUpperCase()){
    const m=FONT5x7(ch);
    const narrow = ch==="'"||ch==="’";
    for(let x=0;x<5;x++){ let c=0; for(let y=0;y<7;y++) if(m[y][x]==="#") c|=1<<y; if(!narrow||c) cols.push(c); }
    cols.push(0);
  }
  return cols;
}
function startLed(canvas, text){
  const ctx=canvas.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ROWS=7, EDGE=.2, SPEED=34; // колонок в секунду; EDGE — поле сверху и снизу в долях шага, без пустых рядов
  const cols=ledColumns(text);
  let W,H,dpr,pitch,nCols,grid,on,raf,alive=true,pos=0,last=performance.now();
  function sprite(color,glow,r,p){
    const c=document.createElement("canvas"); c.width=c.height=Math.ceil(p*2*dpr);
    const x=c.getContext("2d"); x.scale(dpr,dpr); const m=p;
    if(glow){ const g=x.createRadialGradient(m,m,0,m,m,p*1.05); g.addColorStop(0,glow); g.addColorStop(1,"rgba(255,140,0,0)"); x.fillStyle=g; x.fillRect(0,0,p*2,p*2); }
    const d=x.createRadialGradient(m-r*.3,m-r*.3,0,m,m,r); d.addColorStop(0,color[0]); d.addColorStop(.6,color[1]); d.addColorStop(1,color[2]);
    x.fillStyle=d; x.beginPath(); x.arc(m,m,r,0,Math.PI*2); x.fill();
    return c;
  }
  function layout(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!W||!H){ requestAnimationFrame(layout); return; }
    pitch=H/(ROWS+EDGE*2); nCols=Math.ceil(W/pitch)+1;
    const r=pitch*.36;
    grid=sprite(["#2b2118","#1c1610","#110d09"],null,r,pitch);
    on=sprite(["#fff4c8","#ffb52e","#e07a00"],"rgba(255,150,20,.38)",r,pitch);
    draw();
  }
  function draw(){
    if(!grid||!on||!pitch) return;
    ctx.clearRect(0,0,W,H);
    const start=Math.floor(pos), gx=-(pitch*.5), gy=pitch*EDGE-pitch*.5;
    for(let i=0;i<nCols;i++){
      const c=cols[(start+i)%cols.length];
      const x=gx+i*pitch;
      for(let y=0;y<ROWS;y++){
        ctx.drawImage((c>>y)&1?on:grid, x, gy+y*pitch, pitch*2, pitch*2);
      }
    }
  }
  function tick(now){
    if(!alive) return;
    const step=Math.floor((now-last)/1000*SPEED);
    if(step>0){ pos=(pos+step)%cols.length; last+=step*1000/SPEED; draw(); }
    raf=requestAnimationFrame(tick);
  }
  const onResize=()=>{ if(canvas.clientWidth!==W||canvas.clientHeight!==H) layout(); };
  addEventListener("resize",onResize); layout();
  if(!reduce) raf=requestAnimationFrame(tick);
  return {stop(){alive=false;cancelAnimationFrame(raf);removeEventListener("resize",onResize);}};
}

/* ---------- Заставка ----------
   Сайт открывается, когда загрузились картинки первого экрана, но не позже чем через 6 с.
   Отложенные (lazy) картинки не трогаем: они грузятся по мере прокрутки, как раньше. Кольцо — доля загруженных. */
function gateLoader(){
  const ld=$("#loader"); if(!ld) return;
  const bar=$("#ldBar"), t0=performance.now(), MIN=900, MAX=6000;
  let shown=0, closed=false;
  // ждём только свои картинки: чужие (превью YouTube) могут тормозить и держать сайт закрытым
  const own=im=>{ try{ return new URL(im.getAttribute("src")||"", location.href).origin===location.origin; }catch(e){ return true; } };
  const scan=()=>{
    let all=0, ok=0;
    for(const im of document.images){
      if(!im.isConnected || ld.contains(im) || !own(im) || im.loading==="lazy") continue;
      all++;
      if(!im.getAttribute("src") || im.complete) ok++;      // загрузилась или не смогла — ждать дальше нечего
    }
    return all ? ok/all : 1;
  };
  const close=()=>{
    closed=true; bar.style.strokeDashoffset="0"; ld.setAttribute("aria-valuenow","100");
    setTimeout(()=>{ ld.classList.add("done"); setTimeout(()=>{ ld.hidden=true; document.querySelectorAll("img[data-warm]").forEach(im=>{ im.loading="eager"; }); },500); },300);
  };
  const tick=()=>{
    if(closed) return;
    const p=scan(), t=performance.now()-t0;
    shown=Math.max(shown,p);                       // кольцо не откатывается назад
    bar.style.strokeDashoffset=(100-shown*100).toFixed(2);
    ld.setAttribute("aria-valuenow",String(Math.round(shown*100)));
    if((p>=1 && t>=MIN) || t>=MAX) return close();
    setTimeout(tick,120);
  };
  tick();
}
